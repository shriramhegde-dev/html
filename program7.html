<!DOCTYPE html>
<html>
<body>
<h1> HTML UNORDERED-ORDERED LIST </h1>
<p> the "ul" tag is used to unorder a list in html </p>
<ul>
<li> tea </li>
<li> coffee </li>
<li> juice </li>
</ul>
<p> the "ol" tag is used to order a list in html </p>
<ol>
<li> tea </li>
<li> coffee </li>
<li> juice </li>
</ol>
</body>
</html>
